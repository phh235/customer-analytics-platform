[project]
name = "customer-analytics"
version = "0.1.0"
description = "Customer segmentation and purchase value prediction API"
readme = "README.md"
requires-python = ">=3.13"

# === Dependencies ===
# Chia thành các nhóm theo chức năng
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Configuration — đọc settings từ environment variables
    "pydantic-settings>=2.5.0",
    # Database — SQLAlchemy 2 async + PostgreSQL driver
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    # Migration
    "alembic>=1.13.0",
    # Structured logging — log ra JSON ở production
    "structlog>=24.4.0",
    "pwdlib>=0.3.0",
    "argon2-cffi>=25.1.0",
    "pyjwt[crypto]>=2.13.0",
    "pydantic[email]>=2.13.4",
    "uuid-utils>=0.17.0",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "authlib>=1.7.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "openpyxl>=3.1.5",
    "cloudinary>=1.44.1",
    # AI chat provider
    "groq>=0.31.0",
    "sqlglot>=26.0.0",

    "tzdata>=2024.1",
]

# === Dev Dependencies ===
[dependency-groups]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",

    # Code quality
    "ruff>=0.15.21",
    "mypy>=1.11.0",
]

# === FastAPI entrypoint ===
# Cho phép chạy `fastapi dev` hoặc `fastapi run`
[tool.fastapi]
entrypoint = "customer_analytics.main:app"

# === Ruff — Linter + Formatter ===
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (logic errors)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bugs)
]
# Cấm một số pattern nguy hiểm
[tool.ruff.lint.per-file-ignores]
# FastAPI route declarations intentionally construct dependency metadata in
# function signatures; B008 is a false positive for Depends/File/permissions.
"src/customer_analytics/app/features/**/*.py" = ["E501"]
"src/customer_analytics/app/features/**/presentation/routes/*.py" = ["B008"]
"tests/**" = ["B"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# === Mypy — Type Checker ===
[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = true

# === Pytest ===
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Cho pytest-asyncio dùng cùng event loop trong session
asyncio_default_fixture_loop_scope = "function"

# === Coverage ===
[tool.coverage.run]
source = ["src/customer_analytics"]

# === Build system ===
# Bắt buộc để uv sync cài package ở editable mode
[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# === Project settings cho tooling ===
[tool.setuptools.packages.find]
where = ["src"]
